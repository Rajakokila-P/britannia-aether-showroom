name: Website checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: node --check site/app.js && node --check site/contact.js
      - name: Check internal links and required content
        run: python scripts/check.py
